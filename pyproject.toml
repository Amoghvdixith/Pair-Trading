[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-trading-research"
version = "0.1.0"
description = "Educational pairs-trading / statistical-arbitrage research pipeline: cointegration screening with FDR control, OLS/rolling/Kalman hedge ratios, OU diagnostics and an event-driven backtest through the project-02 backtester."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    # Project 02 backtester, installed from a locally built wheel (see README):
    "backtester==0.1.0",
]

[project.optional-dependencies]
kalman-ref = ["pykalman>=0.9"]
market = ["yfinance>=0.2.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
pairs = "pairs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer statistical-calibration or integration runs (deselect with -m 'not slow')",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["src/pairs"]

[tool.coverage.run]
source = ["pairs"]
omit = ["*/cli.py"]
